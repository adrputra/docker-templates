version: "3.8"

services:
  redis:
    image: redis:7.4
    command: sh -c "redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-your_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - main-dev
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints: [node.role == manager]

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-your_redis_password}
      - PORT=6380
    ports:
      - "6380:6380"
    networks:
      - main-dev
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints: [node.role == manager]

volumes:
  redis_data:

networks:
  main-dev:
    external: true
