version: "3.8"

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://154.53.63.99:8090
      TZ: Asia/Jakarta
    ports:
      - "8090:8090"
    volumes:
      - beszel_data:/beszel_data
      - beszel_socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://154.53.63.99:8090
      TOKEN: "main"
      KEY: "06b0c501430dd831d40310a9733cdca5d810d2986ec0a3d2165c5c8da6a6fdf1"
      TZ: Asia/Jakarta

volumes:
  beszel_data:
  beszel_agent_data:
  beszel_socket:
