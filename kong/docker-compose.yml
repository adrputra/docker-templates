networks:
  kong-ee-net:      # Custom bridge network for Kong services
    driver: bridge
  main-dev:         # External network where postgres is running
    external: true

# Common environment variables used by Kong services (bootstrap and CP)
x-kong-config: &kong-env
  KONG_DATABASE: postgres             # Use Postgres as the backing database
  KONG_PG_HOST: postgres              # Connect to postgres service on main-dev network
  KONG_PG_PORT: 5432                  # PostgreSQL port
  KONG_PG_DATABASE: ${KONG_DB_NAME:-kong}  # Name of the database to connect to
  KONG_PG_USER: ${KONG_DB_USER:-admin}      # Database username (match your postgres setup)
  KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}  # Database password (required)

services:

  kong-bootstrap:
    image: '${GW_IMAGE:-kong/kong-gateway:3.13.0.0}'  # Kong Gateway image (default to latest version)
    container_name: kong-bootstrap
    networks:
      - kong-ee-net
      - main-dev  # Connect to main-dev network to access postgres
    restart: on-failure
    environment:
      <<: *kong-env                 # Reuse environment config from x-kong-config
      KONG_PASSWORD: handyshake    # Admin GUI password (required for RBAC)
    command: kong migrations bootstrap  # Run DB migrations to initialize Kong schema

  kong-cp:
    image: '${GW_IMAGE:-kong/kong-gateway:3.13.0.0}'  # Main Kong Gateway Control Plane (default to latest version)
    container_name: kong-cp
    restart: on-failure
    networks:
      - kong-ee-net
      - main-dev  # Connect to main-dev network to access postgres
    environment:
      <<: *kong-env
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl  # Admin API on HTTP + HTTPS
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl  # Kong Manager on HTTP + HTTPS
      KONG_ADMIN_GUI_URL: http://${GW_HOST:-localhost}:9604  # URL for GUI links
      KONG_PASSWORD: handyshake  # Required for logging in to Kong Manager (RBAC)
    depends_on:
      - kong-bootstrap  # Start only after bootstrap has completed
    ports:
      - "9600:8000"  # Proxy HTTP
      - "9601:8443"  # Proxy HTTPS
      - "9602:8001"  # Admin API HTTP
      - "9603:8444"  # Admin API HTTPS
      - "9604:8002"  # Kong Manager HTTP
      - "9605:8445"  # Kong Manager HTTPS