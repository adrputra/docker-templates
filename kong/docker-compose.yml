version: '3.9'

networks:
  kong-net:         # Renamed for OSS clarity
    driver: overlay
    attachable: true
  main-dev:         # External overlay network where postgres is running
    external: true

# Common environment variables used by Kong services
x-kong-config: &kong-env
  KONG_DATABASE: postgres
  KONG_PG_HOST: postgres              # Connect to postgres service on main-dev network
  KONG_PG_PORT: 5432
  KONG_PG_DATABASE: kong
  KONG_PG_USER: admin
  KONG_PG_PASSWORD: "Contabo8@adr"
  # OSS Admin Listener (no auth by default, access restricted by network)
  KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
  # Kong Manager OSS
  KONG_ADMIN_GUI_URL: https://kong-manager.yangpenting.fun
  KONG_ADMIN_GUI_API_URL: https://kong-admin.yangpenting.fun
  KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl

services:
  kong:
    image: kong:3.13     # Explicit OSS tag
    networks:
      kong-net:
      main-dev:
        aliases:
          - kong
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    environment:
      <<: *kong-env
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: 1.0
    ports:
      - "9500:8000"  # Proxy HTTP
      - "9501:8443"  # Proxy HTTPS
      - "9502:8001"  # Admin API HTTP (Careful exposing this publicly)
      - "9503:8444"  # Admin API HTTPS
      - "9504:8002"  # Kong Manager HTTP
      - "9505:8445"  # Kong Manager HTTPS