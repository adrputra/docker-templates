version: "3.8"

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    ports:
      - "16686:16686"   # Jaeger UI
      - "6831:6831/udp" # UDP for agent
      - "6832:6832/udp"
      - "5778:5778"
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
      - "14268:14268"   # Collector HTTP
      - "14250:14250"   # Collector gRPC
      - "9411:9411"     # Zipkin
    networks:
      - main-dev
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  main-dev:
    external: true
