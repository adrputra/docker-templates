version: "3.8"

services:
  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount local Caddyfile directly instead of using docker config
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      replicas: 1
      restart_policy:
        condition: any

volumes:
  caddy_data:
  caddy_config:
